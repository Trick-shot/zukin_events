<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Zukin Hall">
  <title>Zukin Hall</title>
  <!--
    The sign mark reduced to its initial. The header lockup (BrandMark) is two
    stacked words on the sign red; at 16px, which is the size that actually
    matters for a tab, two lines of type are an illegible smudge, so the mark
    keeps what survives: the red tile and the Z.

    The Z is a path, not a text element: a favicon renders with no network and
    no guaranteed font, so type here would fall back to whatever the OS has
    and change shape between machines.

    Fill is the sign red (color token "red", hex C8102E), the only accent in
    v3. Radius 6 of 32 matches the lockup's rounded square proportion.

    Note for editors: this is strict XML. Do not write a double hyphen inside
    this comment, including in token names, or the whole file stops parsing
    and the tab silently falls back to the default glyph.
  -->
  <rect width="32" height="32" rx="6" fill="#C8102E" />
  <path d="M9 8h14v4.6l-7.7 6.2H23V24H9v-4.6l7.7-6.2H9z" fill="#fff" />
</svg>
