<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The sign mark. SVG so it stays crisp on any density and follows the
         tab's own scaling; browsers that cannot take an SVG icon fall back to
         /favicon.ico, which does not exist yet and simply shows the default
         page glyph rather than a broken image. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- LocalBusiness JSON-LD lands in milestone (f). -->
    <title>Zukin Hall | Event venue and decoration in Dodoma</title>
    <meta
      name="description"
      content="Zukin Hall is an event venue and decoration service in Dodoma, Tanzania."
    />
    <meta name="theme-color" content="#2a0a16" />

    <!--
      Open Graph, static. usePageMeta rewrites the title and description per
      route, but most link unfurlers run no JavaScript, so these values are
      what a shared link previews with whichever page was shared. Making the
      preview match the page needs server rendering or prerendering, not more
      tags here.

      og:image is absolute on purpose. The Open Graph spec requires it, and
      while Facebook resolves a relative path against og:url, several
      unfurlers including X do not and simply show no image.

      TODO: og:url and og:image carry the placeholder origin. Confirm the
      real domain before launch, alongside robots.txt and sitemap.xml.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zukin Hall" />
    <meta property="og:url" content="https://zukinhall.co.tz/" />
    <meta property="og:title" content="Zukin Hall | Event venue and decoration in Dodoma" />
    <meta
      property="og:description"
      content="An event venue and decoration service in Dodoma, Tanzania, with two rooms, in-house stylists and on-site parking."
    />
    <meta property="og:image" content="https://zukinhall.co.tz/images/venue/hall_tables.jpg" />
    <meta property="og:image:alt" content="The Zukin Hall main hall, tables laid for an event" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* First-paint splash: a plain white screen while the JS bundle loads,
         removed the moment React mounts (#root gets children). The flower
         takes over from BootVeil as soon as React is up. Deliberately no
         spinner here: this paint lasts a few hundred milliseconds, and a
         mark that appears only to be replaced by a different one reads worse
         than a calm white hold. Kept inline so it needs no network. */
      #root:empty::before {
        content: '';
        position: fixed;
        inset: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
