<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The sign mark. SVG so it stays crisp on any density and follows the
         tab's own scaling; browsers that cannot take an SVG icon fall back to
         /favicon.ico, which does not exist yet and simply shows the default
         page glyph rather than a broken image. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Full SEO, Open Graph and LocalBusiness JSON-LD land in milestone (f). -->
    <title>Zukin Hall | Event venue and decoration in Dodoma</title>
    <meta
      name="description"
      content="Zukin Hall is an event venue and decoration service in Dodoma, Tanzania."
    />
    <meta name="theme-color" content="#2a0a16" />
    <style>
      /* First-paint splash: a plain white screen while the JS bundle loads,
         removed the moment React mounts (#root gets children). The flower
         takes over from BootVeil as soon as React is up. Deliberately no
         spinner here: this paint lasts a few hundred milliseconds, and a
         mark that appears only to be replaced by a different one reads worse
         than a calm white hold. Kept inline so it needs no network. */
      #root:empty::before {
        content: '';
        position: fixed;
        inset: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
